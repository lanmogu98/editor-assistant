[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "editor_assistant"
version = "0.6.0"
requires-python = ">=3.10"
dependencies = [
    "llm-exec-core",
    "markitdown[all]",
    "requests",  # Deprecated: will be removed after async migration complete
    "httpx>=0.25.0",
    "pydantic",
    "trafilatura",
    "readabilipy",
    "html2text",
    "pyyaml",
    "jinja2",
    "rich>=13.0.0",
]

[project.scripts]
editor-assistant = "editor_assistant.cli:main"
any2md = "editor_assistant.md_converter:main"
html2md = "editor_assistant.clean_html_to_md:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

# include prompt templates in the package
[tool.setuptools]
package-data = { "editor_assistant" = ["config/prompts/*.txt"] }

[tool.uv.sources]
llm-exec-core = { path = "../llm-exec-core", editable = true }
